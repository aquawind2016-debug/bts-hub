steps:
  - name: Checkout repository
    uses: actions/checkout@v3

  - name: Set up Python
    uses: actions/setup-python@v4
    with:
      python-version: '3.10'

  - name: Install dependencies
    run: |
      python -m pip install --upgrade pip
      pip install requests beautifulsoup4 feedparser

  - name: Run BTS News Collector
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    run: |
      python bts_news_collector.py

  - name: Commit and push updated news.json
    run: |
      git config --global user.name "BTS-News-Bot"
      git config --global user.email "bot@bts-hub.com"
      git add news.json
      git commit -m "Auto-update: BTS 6하원칙 AI 뉴스 데이터 갱신" || exit 0
      git push
