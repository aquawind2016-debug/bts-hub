name: BTS News Auto Collector

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

# ⭐️ 로봇에게 파일 저장(쓰기) 권한을 부여하는 가장 중요한 코드입니다!
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: 1. 내 저장소 코드 가져오기 (경고 해결 완료)
      uses: actions/checkout@v4

    - name: 2. 파이썬 설치하기 (경고 해결 완료)
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 3. 파이썬 로봇 준비물 설치
      run: pip install requests google-generativeai

    - name: 4. 뉴스 수집 및 Gemini AI 6하원칙 요약 실행!
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: python bts_news_collector.py

    - name: 5. 요약된 뉴스 데이터 깃허브에 자동 저장
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add news_data.json
        git commit -m "🚀 BTS 실시간 뉴스 AI 6하원칙 요약 업데이트 완료" || echo "새로운 뉴스가 없습니다."
        git push
