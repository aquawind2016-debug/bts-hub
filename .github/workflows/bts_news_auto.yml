name: BTS News Auto Collector

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: 1. 내 저장소 코드 가져오기
      uses: actions/checkout@v4

    - name: 2. 파이썬 설치하기
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 3. 파이썬 로봇 준비물 설치
      run: pip install requests google-genai

    - name: 4. 뉴스 및 스텁허브 일정 수집 실행! (에러 방어 모드)
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: python bts_news_collector.py || true

    - name: 5. 수집된 데이터 깃허브에 자동 저장 (무적 모드)
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add news_data.json schedule_data.json || true
        git commit -m "🚀 BTS 실시간 뉴스 및 일정 업데이트 완료" || true
        git pull --rebase || true
        git push || true
